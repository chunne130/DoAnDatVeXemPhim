<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
.desktop-search-dropdown {
    width: 320px;
    background: rgba(1, 10, 4, 0.95);
    display: flex;
    flex-direction: column;
}
</style>
</head>
<body style="background: white;">
<div class="desktop-search-dropdown">
    <a href="#" class="search-result-item" style="display: flex; align-items: center; padding: 10px 15px; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.05); position: relative; overflow: hidden; width: 100%; box-sizing: border-box;">
        <img src="https://via.placeholder.com/40" class="search-result-img" style="width: 40px; min-width: 40px; height: 56px; border-radius: 4px; object-fit: cover; margin-right: 12px; flex-shrink: 0;">
        <div class="search-result-info" style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; overflow: hidden;">
            <p class="search-result-title" style="color: #fff; font-size: 0.9rem; font-weight: 600; margin: 0 0 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; width: 100%;">Quỷ Nhập Tràng 2</p>
            <p class="search-result-duration" style="color: #9ca3af; font-size: 0.75rem; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; width: 100%;">T13 &middot; 126 phút</p>
        </div>
        <i class="bi bi-ticket-perforated search-result-ticket" style="color: #00ff87; font-size: 1.1rem; margin-left: 10px; flex-shrink: 0;"></i>
    </a>
</div>
</body>
</html>
